    The proof follows the frozen graded-interval manuscript. Almost-split
    transfer is expressed using its last map, middle-term decomposition and
    nonsplit epimorphisms; the displayed graded kernel is not separately named.
    The public statement includes Morita reduction for nonbasic input algebras.
    Examples are not separately certified. See docs/PAPER-CORRESPONDENCE.md.
    No weakening of the theorem's hypotheses or conclusion is known.
