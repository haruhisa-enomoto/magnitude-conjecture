    type: "manuscript"
    relationship: "formalizes"
    note: "Revised manuscript frozen September 21 in docs/manuscript/; exact proof correspondence is recorded in docs/PAPER-CORRESPONDENCE.md."
  - title: "An equidistribution conjecture for quotient-closed and submodule-closed subcategories: Lean formalization"
    authors: ["Haruhisa Enomoto"]
    type: "formalization"
    relationship: "background"
