    authors: ["Erlend D. Børve", "Daniel Horiatakis", "Martin Kalck"]
    id: "arXiv:2607.07555v1"
    type: "preprint"
    relationship: "background"
    location: "https://arxiv.org/abs/2607.07555v1"
    note: "Source of the magnitude conjecture resolved by the formalized theorem."
