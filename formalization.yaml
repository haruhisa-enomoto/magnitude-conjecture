version: "v0.4"
project:
  name: "Magnitude conjecture for module categories"
  description: >-
    The magnitude of the module category of a finite-dimensional
    representation-finite algebra over an algebraically closed field is at
    least its number of simple-module isomorphism classes, with equality
    exactly when its basic algebra is special biserial. The formalization
    includes nonsingularity of the Hom matrix and the full equality case.
  authors: ["Haruhisa Enomoto"]
  responsible_maintainers: ["Haruhisa Enomoto"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.RT"]
  msc2020: ["16G10", "16G70"]
