name: Formalization

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (use a configured runner with at least 16 GB RAM for replay)
        type: string
        default: ubuntu-24.04
      docs:
        description: Generate the complete project API and website artifact
        type: boolean
        default: true
      replay:
        description: Run the pinned local Comparator/NanoDa toolchain (see verification qualifications)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-site:
    runs-on: ubuntu-24.04
    outputs:
      proof_changed: ${{ steps.changes.outputs.proof_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect proof changes
        id: changes
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          manual = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          before = event.get('before', '')
          if 'pull_request' in event:
              base = event['pull_request']['base']['sha']
              head = event['pull_request']['head']['sha']
              revisions = [f'{base}...{head}']
          elif before and set(before) != {'0'}:
              revisions = [before, os.environ['GITHUB_SHA']]
          else:
              revisions = []
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', *revisions], text=True).splitlines() if revisions else []
          proof_scripts = {'scripts/build_lean_serial.py', 'scripts/audit_axioms.py',
                           'scripts/verify-comparator.sh', 'scripts/landrun-wrapper.sh',
                           'comparator.json', '.github/toolchain-pins.env'}
          rebuild = manual or not revisions or any(
              p.endswith('.lean') or Path(p).name in
              {'lean-toolchain', 'lake-manifest.json', 'lakefile.toml'} or
              p in proof_scripts for p in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'proof_changed={str(rebuild).lower()}\n')
          print('Proof build required:', rebuild)
          PYCODE
      - run: python3 scripts/generate_challenge.py --check
      - run: python3 -m unittest discover -s tests
      - run: ruby scripts/validate-formalization.rb
      - name: Validate the upstream metadata schema
        run: |
          python3 -m venv "$RUNNER_TEMP/metadata-validator"
          "$RUNNER_TEMP/metadata-validator/bin/pip" install check-jsonschema==0.38.0
          "$RUNNER_TEMP/metadata-validator/bin/check-jsonschema" --schemafile \
            https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json \
            formalization.yaml
      - run: bash -n scripts/verify-comparator.sh scripts/landrun-wrapper.sh
      - run: python3 scripts/build_website.py
      - run: python3 scripts/check_website.py

  proof:
    # Public proof changes build automatically; documentation-only updates
    # reuse the checked proof. Manual dispatch always requests a full build.
    needs: source-and-site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.repository.private && needs.source-and-site.outputs.proof_changed == 'true')
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Provide swap for private runners with less RAM
        run: |
          if [ "$(awk '/MemTotal/ { print $2 }' /proc/meminfo)" -lt 12000000 ]; then
            sudo fallocate -l 4G /tmp/magnitude-ci.swap
            sudo chmod 600 /tmp/magnitude-ci.swap
            sudo mkswap /tmp/magnitude-ci.swap
            sudo swapon /tmp/magnitude-ci.swap
          fi
      - name: Build complete proof and both statement modules serially
        run: >-
          python3 scripts/build_lean_serial.py --package . --output .build-audit/ci
          --max-rss-kib 12582912
          MagnitudeConjecture MagnitudeConjecture.AxiomAudit Challenge Solution
      - name: Query public axioms
        run: |
          python3 scripts/audit_axioms.py
          python3 scripts/audit_axioms.py --full
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: inputs.replay
        with:
          go-version: "1.27.1"
          cache: false
      - name: Independent replay
        if: inputs.replay
        run: ./scripts/verify-comparator.sh > .build-audit/comparator.log 2>&1
      - name: Build documentation tool serially
        if: inputs.docs
        working-directory: docbuild
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: >-
          python3 ../scripts/build_lean_serial.py --package .
          --output ../.build-audit/doc-tool --max-rss-kib 12582912 doc-gen4
      - name: Generate project API and website
        if: inputs.docs
        run: |
          python3 scripts/build_api.py
          python3 scripts/build_website.py
          python3 scripts/check_website.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-evidence
          path: .build-audit/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.docs && success()
        with:
          name: magnitude-website
          path: _site/
          if-no-files-found: error
